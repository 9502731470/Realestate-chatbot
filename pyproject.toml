[project]
name = "dg-wasalt-assistant"
version = "1.3.4"
description = "RAG chatbot over public DarGlobal and Wasalt real-estate data (OpenRouter free models)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
  "E501",    # long lines are allowed in data tables / prompts
  "RUF001",  # ambiguous unicode (we intentionally use Arabic and typographic characters)
  "RUF002",
  "RUF003",
  "B008",    # FastAPI dependency defaults
  "SIM108",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
